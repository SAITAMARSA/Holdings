<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giggle Lounge · Hosting check</title>
<style>
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: #2A0A5E; color: #fff; padding: 20px; }
  main { max-width: 720px; margin: 0 auto; } h1 { margin: 0 0 4px; } p.sub { color: #d8c4ff; margin-top: 0; }
  .card { background: #fff; color: #3a1a5a; border-radius: 18px; padding: 16px 18px; margin: 14px 0; }
  .row { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; border-bottom: 1px solid #f0e4f7; } .row:last-child { border: 0; }
  .ic { width: 26px; flex: none; text-align: center; font-size: 1.1rem; } small { color: #8a6aa8; display: block; }
  button { font: inherit; padding: 10px 18px; border-radius: 12px; border: 0; background: #3FD64F; color: #fff; font-weight: 700; cursor: pointer; }
  a { color: #FFD23F; }
</style>
</head>
<body><main>
<h1>🩺 Hosting check</h1>
<p class="sub">Open this once after you upload Giggle Lounge. Everything should be ✅. Delete this file when you're happy.</p>
<div class="card" id="out">Running checks…</div>
<div class="card"><b>Parallel-request test</b><small>Real-time play keeps one request open per player. This fires 6 at once for 2 seconds each.</small><div id="par" style="margin-top:8px">Waiting…</div></div>
<p><a href="./">← Back to Giggle Lounge</a></p>
<script>
const row = (ok, text, note) => `<div class="row"><span class="ic">${ok === true ? "✅" : ok === "warn" ? "⚠️" : "❌"}</span><div>${text}${note ? "<small>" + note + "</small>" : ""}</div></div>`;
async function ping(hold) { const t = performance.now(); const r = await fetch("api/ping.php" + (hold ? "?hold=" + hold : ""), { method: "POST", headers: { "X-GL": "1", "Content-Type": "application/json" }, body: "{}" }); const j = await r.json(); return { j, ms: performance.now() - t }; }
(async () => {
  const out = document.getElementById("out"), par = document.getElementById("par");
  try {
    const { j, ms } = await ping();
    let html = "";
    Object.keys(j.checks).forEach((k) => { const c = j.checks[k]; html += row(c.ok ? true : c.warn ? "warn" : false, c.note); });
    html += row(true, "PHP responds in " + Math.round(ms) + " ms");
    out.innerHTML = html;
    const t0 = performance.now(); const rs = await Promise.all([1, 2, 3, 4, 5, 6].map(() => ping(2)));
    const total = (performance.now() - t0) / 1000;
    const parallel = total < 5;
    par.innerHTML = row(parallel ? true : "warn", "6 requests of 2 s took " + total.toFixed(1) + " s",
      parallel ? "Your host runs requests in parallel — real-time play will feel snappy." : "Your host seems to run requests one after another. Set POLL_WAIT_MAX to 0 in api/config.local.php (plain polling), and expect about half a second of delay.");
  } catch (e) {
    out.innerHTML = row(false, "Couldn't reach api/ping.php", "Is PHP enabled for this folder? (" + e.message + ")");
  }
})();
</script></main></body></html>
